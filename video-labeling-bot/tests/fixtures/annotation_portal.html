<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Annotation Fixture</title>
  </head>
  <body>
    <form id="annotation-form">
      <label>
        Start
        <input name="startTime" id="startTime" placeholder="Start" />
      </label>
      <label>
        End
        <input name="endTime" id="endTime" placeholder="End" />
      </label>
      <label>
        Label
        <textarea name="label" id="label" placeholder="Label"></textarea>
      </label>
      <button type="button" id="add-timestamp">Add Timestamp</button>
      <button type="submit" id="submit">Submit</button>
    </form>
    <ul id="segments"></ul>
    <p id="submitted" hidden>submitted</p>
    <script>
      const segments = document.getElementById("segments");
      document.getElementById("add-timestamp").addEventListener("click", () => {
        const start = document.querySelector('[name="startTime"]').value;
        const end = document.querySelector('[name="endTime"]').value;
        const label = document.querySelector('[name="label"]').value;
        const item = document.createElement("li");
        item.textContent = start + " - " + end + " -> " + label;
        segments.appendChild(item);
      });
      document.getElementById("annotation-form").addEventListener("submit", (event) => {
        event.preventDefault();
        document.getElementById("submitted").hidden = false;
      });
    </script>
  </body>
</html>
