<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Atlas Capture Fixture</title>
  </head>
  <body>
    <video
      id="player"
      muted
      playsinline
      controls
      width="320"
      height="180"
      poster="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg=="
    ></video>
    <form id="annotation-form">
      <input
        data-ph-unmask="true"
        aria-label="Segment 1 label"
        autocomplete="off"
        spellcheck="false"
        maxlength="2000"
        data-segment-start-seconds="0"
        class="w-full rounded-lg border"
        value=""
      />
      <input
        data-ph-unmask="true"
        aria-label="Segment 2 label"
        autocomplete="off"
        spellcheck="false"
        maxlength="2000"
        data-segment-start-seconds="3"
        class="w-full rounded-lg border"
        value=""
      />
      <button type="button" id="next">Next</button>
      <button type="submit" id="submit">Submit</button>
    </form>
    <p id="submitted" hidden>submitted</p>
    <script>
      document.getElementById("annotation-form").addEventListener("submit", (event) => {
        event.preventDefault();
        document.getElementById("submitted").hidden = false;
      });
      document.getElementById("next").addEventListener("click", () => {
        document.getElementById("submitted").hidden = false;
      });
    </script>
  </body>
</html>
