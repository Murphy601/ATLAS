[task]
name = "afterquery/till-wal-rebuild"

[metadata]
author_name = "Sana Rasheed"
author_email = "sanarasheed22a@gmail.com"
difficulty_explanation = "The hard part is the pile-up, not one trick. Three encodings on disk, a WAL that dies mid-frame, and an inbox still landing while the writer fence is moving. Treat CSV clocks as UTC instead of Nairobi and the sort order changes, so the wrong duplicate gets the TransID. Trust the amount on the STK callback and you book junk. Miss that 47.000s is still in time and 47.001s is not, and a payment that should post gets thrown out. Fee is 85 bps half-even, never under 120 cents, VAT 16 percent on that fee not on the till amount — you can get every posting rule 'almost' right and the books are still wrong. A human spends a shift on this because the dump is ugly, not because the rules were hidden. The dump is fake data I put together: 132 intents, a C2B CSV, and two length-prefixed binaries (torn crash WAL plus the nclog handoff). It is meant to feel like a real Kenyan till crash, not a dozen tidy rows, so those encoding and ordering mistakes actually bite. Day job for this is the payments person on call for the till writer — same engineer who already matches M-Pesa STK/C2B and cannot sign off until the journal replays and still balances."
solution_explanation = "Replay the complete WAL frames first and skip the torn tail. Then parse jsonl, the Nairobi CSV, and nclog into one list, sort by time then source then seq, and walk it: fence, duplicates, STK result codes, 47s window. Successful STK uses the intent amount; C2B uses the CSV amount. Each success is two signed posts, 85 bps half-even fee with a 120 cent floor, VAT on the fee. Anything still pending at as_of that you have not already rejected gets expired."
verification_explanation = "Tests read the three JSON files and check they exist, every entry sums to zero, the five accounts sum to zero, and the summary magnitudes match those accounts. Then they compare the accepted (intent, trans_id) pairs, the per-intent line books, and the reject tuples (intent, reason, trans_id, source) against a frozen golden rebuild from the same dump. A handful of named intents pin the ugly cases: 47.000s vs 47.001s, stale fence, duplicate TransID, failed STK, WAL then a second inbox hit, C2B Nairobi amount, expiry at as_of, ignored callback amount, and the broken jsonl line."
category = "Software"
subcategory = "Systems"
tags = ["python", "debugging", "ledger", "wal"]
expert_time_estimate_hours = 8
relevant_experience = "I work on Sokoni, a Kenya shop that takes M-Pesa STK at checkout. Last year was mostly duplicate TransIDs, a writer dying mid-flush, and a ledger that would not come back clean after a crash."

