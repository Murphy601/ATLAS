artifacts = ["/app/output/ledger.json", "/app/output/rejects.json", "/app/output/summary.json"]

[task]
name = "afterquery/till-wal-rebuild"

[metadata]
author_name = "Sana Rasheed"
author_email = "sanarasheed22a@gmail.com"
difficulty_explanation = "The rebuild has to parse three different on-disk encodings, replay a torn length-prefixed WAL, then apply a mixed inbox while a writer fence is still moving. Small mistakes compound: treating Nairobi CSV clocks as UTC reorders events and flips which duplicate wins; using the STK callback amount books the wrong cents; an inclusive vs exclusive 47.000s timeout flips a pinned payment; half-even fee rounding with a 120-cent floor and VAT-on-fee (not VAT-on-gross) is easy to almost-implement. Humans spend a shift on this because the crash dump is messy, not because anything was hidden."
solution_explanation = "Replay complete WAL frames into the ledger and occupancy sets first, ignoring a torn tail. Parse jsonl, Nairobi-local CSV, and nclog into a single record list, sort by time/source/seq, then apply fence, duplicates, STK result codes, and the 47s window. Book two signed double-entry posts per success using the intent amount for STK and the CSV amount for C2B, with 85bps half-even fees floored at 120 cents and 16% VAT on the fee. Expire leftover pending intents against as_of."
verification_explanation = "The sealed suite checks file presence, that every entry and the full chart of accounts sums to zero, that summary magnitudes match the T-accounts, and that the accepted (intent, trans_id) set, per-intent line books, and reject (intent, reason, trans_id, source) set match a frozen golden rebuild. Pinned cases cover the 47.000s boundary, stale fence, duplicate trans_id, failed STK, WAL-then-duplicate-inbox, C2B Nairobi amount, rebuild expiry, ignored callback amount, and the garbage jsonl line."
category = "Software"
subcategory = "Systems"
tags = ["python", "debugging", "ledger", "wal"]
expert_time_estimate_hours = 8
relevant_experience = "I build and operate Sokoni, a Kenya commerce stack with M-Pesa STK checkout, till callbacks, and order settlement. Most of the last year has been duplicate TransIDs, writers that die mid-flush, and ledgers that do not reverse cleanly after a crash."

[verifier]
timeout_sec = 600.0
environment_mode = "separate"

