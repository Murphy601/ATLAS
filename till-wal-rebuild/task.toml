[task]
name = "afterquery/till-wal-rebuild"

[metadata]
author_name = "Sana Rasheed"
author_email = "sanarasheed22a@gmail.com"
difficulty_explanation = "A person spends a shift on this because the crash dump is ugly, not because a rule was hidden. Four encodings landed at once and the tail is still on a live feed that pages and wants a token — one GET leaves most of the shift on the floor. Sqlite already checkpointed two legs the WAL will repeat. nclog grew an HMAC, and some frames are gzip under an NCZG prefix. CSV clocks are Nairobi, some amounts have thousands commas, and till 882211 is not on the 85 bps book. Treat those clocks as UTC and the sort flips, so the wrong duplicate keeps the TransID. Trust the STK callback amount and you book junk. Miss that 47.000s is still in time and 47.001s is not, and a payment that should have posted is gone. The dump is fake data I put together: 136 intents, a C2B CSV, a torn WAL, HMAC nclog, posted.db, and a paginated feed payload. It is meant to feel like a real Kenyan till crash, not a dozen tidy rows. Day job for this is the payments person on call for the till writer — same engineer who already matches M-Pesa STK/C2B and cannot sign off until the journal replays and still balances."
solution_explanation = "Hit the feed with the token, walk /v1/frames until next is null, and stick the base64 pages back into one byte string. Replay posted.db, then the old length-prefixed WAL, counting it even when sqlite already has that trans_id. Parse jsonl, the Nairobi CSV (strip commas), HMAC nclog (gunzip the NCZG ones), and the feed stream. Sort by time then source then seq. Walk that list: fence, duplicates, STK result codes, 47s window. STK books the intent amount on the intent's till. C2B books the CSV amount on the CSV till. Two signed posts each time. Reversals negate whatever was booked. Pending still open at as_of, and not already rejected, expires."
verification_explanation = "Tests open the four output files. Books have to balance, summary magnitudes have to match the accounts, and then the accepted (intent, trans_id) pairs, per-intent lines, and reject tuples have to match a frozen rebuild from this dump. A few named intents pin the ugly cases: 47.000s vs 47.001s, stale fence, duplicate TransID, WAL skipped because sqlite already had it, feed# sources and feed_frames, till 882211 on 110 bps / min 200, CSV 1,250.00, a gzip nclog that still books the intent amount, a C2B reverse plus already_reversed and unknown_trans_id, sha256 entry ids, and a non-empty audit log."
category = "Software"
subcategory = "Systems"
tags = ["python", "debugging", "ledger", "wal"]
expert_time_estimate_hours = 8
relevant_experience = "I have been on-call for M-Pesa till settlement in Nairobi. The last year was duplicate TransIDs, a writer dying mid-flush, and a journal that would not come back clean after a crash."

