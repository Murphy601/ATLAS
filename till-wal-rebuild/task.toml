[task]
name = "afterquery/till-wal-rebuild"

[metadata]
author_name = "Sana Rasheed"
author_email = "sanarasheed22a@gmail.com"
difficulty_explanation = "The hard part is the pile-up, not one trick. Disk dump plus a live paginated feed, HMAC-framed nclog with optional NCZG gzip payloads, a sqlite checkpoint the WAL repeats, per-till fee books, CSV thousands commas, and C2B reversals all have to land in one ordered replay. Treat CSV clocks as UTC instead of Nairobi and the sort order changes, so the wrong duplicate gets the TransID. One GET to the feed without following next misses most of the tail. Skip the token header and you get nothing. Read nclog as old length-prefixed frames and the HMAC bytes parse as garbage. Trust the STK callback amount or the wrong till's 85 bps book and the cash line is wrong. Miss that 47.000s is still in time and 47.001s is not, and a payment that should post gets thrown out. A human spends a shift on this because the dump is ugly, not because the rules were hidden. The dump is fake data I put together: 136 intents, a C2B CSV, two binaries (torn WAL plus HMAC nclog), posted.db, and a paginated feed payload. It is meant to feel like a real Kenyan till crash, not a dozen tidy rows. Day job for this is the payments person on call for the till writer — same engineer who already matches M-Pesa STK/C2B and cannot sign off until the journal replays and still balances."
solution_explanation = "Start or hit the local feed daemon, send the token, follow paginated /v1/frames until next is null, and concatenate the base64 pages. Replay posted.db then the length-prefixed WAL (counting skipped duplicates). Parse jsonl, Nairobi CSV (strip thousands commas), and HMAC nclog (inflate NCZG gzip payloads) plus the feed stream into one list, sort by time then source then seq, and walk it: fence, duplicates, STK result codes, 47s window. Successful STK uses the intent amount and the intent's till fee; C2B uses the CSV amount and CSV till. Each success is two signed posts. Reversals negate booked legs. Anything still pending at as_of that you have not already rejected gets expired."
verification_explanation = "Tests read the four output files. They check books balance, summary magnitudes, then the accepted pairs, per-intent lines, and reject tuples against a frozen golden rebuild. Extra pins: 47.000s vs 47.001s, stale fence, duplicate TransID, WAL skipped when sqlite already has it, feed# sources with feed_frames matching golden, till 882211 using 110 bps / min 200, CSV 1,250.00, gzip nclog booking the intent amount, C2B reversal already_reversed and unknown_trans_id, sha256 entry ids, and a non-empty audit.ndjson."
category = "Software"
subcategory = "Systems"
tags = ["python", "debugging", "ledger", "wal"]
expert_time_estimate_hours = 8
relevant_experience = "I work on Sokoni, a Kenya shop that takes M-Pesa STK at checkout. Last year was mostly duplicate TransIDs, a writer dying mid-flush, and a ledger that would not come back clean after a crash."

