[task]
name = "afterquery/till-wal-rebuild"

[metadata]
author_name = "Sana Rasheed"
author_email = "sanarasheed22a@gmail.com"
difficulty_explanation = "A person spends a shift on this because the crash dump is ugly, not because a rule was hidden. The on-box writer is still sitting under /app/writer; running it as-is does not replay this crash. Sqlite checkpointed two legs, there are two WAL files, nclog is MAC'd with some compressed payloads, and the live tail pages behind a token — plus a bad MAC in the middle of that tail, so skipping ahead books junk. CSV clocks are Nairobi, some amounts have thousands commas, and till 882211 is not on the 85 bps book. Trust the STK callback amount and you book junk. Miss that 47.000s is still in time and 47.001s is not, and a payment that should have posted is gone. The dump is fake data I put together: 158 intents, a C2B CSV, two WAL files, HMAC nclog, posted.db, and a paginated feed payload. It is meant to feel like a real Kenyan till crash, not a dozen tidy rows. Day job for this is the payments person on call for the till writer — same engineer who already matches M-Pesa STK/C2B and cannot sign off until the journal replays and still balances."
solution_explanation = "Do not trust /app/writer for this dump. Hit the feed with the token and follow pages until it is done. Replay posted.db, then every crash_wal file in name order, counting WAL frames even when sqlite already has that trans_id. Parse jsonl, the Nairobi CSV, HMAC nclog (decompress what needs it), and the feed stream, stopping a stream on a bad MAC. Sort by time then source then seq. STK books the intent amount on the intent's till. C2B books the CSV amount on the CSV till. Reversals negate booked legs. Pending still open at as_of expires."
verification_explanation = "Tests open the four output files. Books have to balance and then match a frozen rebuild from this dump. Pins include 47.000s vs 47.001s, sqlite vs WAL on int_0008, the second WAL file on int_0015, till 882211 fees, CSV 1,250.00, gzip nclog, C2B reverse, feed bad_mac that must not book SKIPAFTERMAC, sha256 entry ids, and a non-empty audit log."
category = "Software"
subcategory = "Systems"
tags = ["python", "debugging", "ledger", "wal"]
expert_time_estimate_hours = 8
relevant_experience = "I have been on-call for M-Pesa till settlement in Nairobi. The last year was duplicate TransIDs, a writer dying mid-flush, and a journal that would not come back clean after a crash."

