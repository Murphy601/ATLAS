{
  "clock": "as_of file. not wall clock.",
  "replay_order": [
    "posted.db, table posted, rowid order: intent_id, trans_id, occurred_at, fence, lines_json",
    "then crash_wal/writer.wal \u2014 old u32be+json, type=entry. count wal_replayed even if sqlite already has that trans_id. don't book it twice.",
    "then inbox on disk (jsonl, csv, hmac nclog) plus the live feed stream, one sorted list",
    "then expire leftover pending against as_of"
  ],
  "fence": {
    "file": "writer_fence, one integer",
    "smaller_than_current": "stale_fence, skip booking",
    "larger": "that's the new fence. disk file can lag."
  },
  "stk": {
    "timeout_ms": 47000,
    "timeout_inclusive": true,
    "book_amount": "pending intent amount_cents. ignore callback amount_cents, that field lies.",
    "result_code_nonzero": "stk_failed",
    "unknown_intent": "unknown_intent",
    "fee_till": "the pending intent's till, looked up in tills.json. not the callback till."
  },
  "tills": "tills.json keyed by till id. timezone, fee_bps, fee_min_cents, vat_rate. fee is bps of amount, half-even, never under the floor. VAT is vat_rate of that fee, half-even. two legs, debits +, lines sum to 0. 882211 is not the 85 bps book.",
  "nclog": {
    "key_file": "nclog.key raw bytes. trailing newline is part of the key.",
    "layout": "u32be(len(payload)) then hmac-sha256(key, payload) then payload",
    "payload": "utf-8 json, unless it starts with NCZG. then bytes[4:] is gzip of the json. hmac covers the NCZG prefix, not the inflated json.",
    "bad_mac": "stop this stream. reject bad_mac, source STREAM:mac (handoff.nclog:mac or feed:mac). do not skip ahead.",
    "torn_length_or_payload": "stop this stream. no extra reject.",
    "disk_source": "handoff.nclog#n starting at 1",
    "feed_source": "feed#n starting at 1 after you concatenate every page"
  },
  "feed": {
    "origins": [
      "http://127.0.0.1:9377",
      "http://feed:9377"
    ],
    "start_path": "/v1/frames",
    "auth_header": "X-Nyota-Token: trim(feed.token). no extra spaces.",
    "response": "json: payload_b64 (std base64 of raw nclog bytes) and next (a path like /v1/frames?cursor=1, or null). decode, concat, follow next on the same origin until null. one GET is not the tail.",
    "daemon": "/opt/nyota-feed/serve.py on :9377. if the port is dead, start it.",
    "feed_frames": "complete hmac payloads parsed from the concatenated feed bytes. not the torn stub at the end."
  },
  "csv": {
    "file": "inbox/mpesa_c2b.csv",
    "header": [
      "Receipt",
      "Time",
      "AmountKES",
      "Till",
      "TransID",
      "Intent",
      "Fence",
      "Type"
    ],
    "time": "naive cells are the till timezone in tills.json (Africa/Nairobi). they do not have a Z.",
    "AmountKES": "KES decimal. thousands commas happen. half-even to cents.",
    "Type": {
      "C2B": "book the csv amount on that row's till fee book",
      "REVERSAL": "lookup TransID. unknown_trans_id / already_reversed / else negate the legs you already booked. do not recompute fee."
    }
  },
  "jsonl": "one object per line. broken line: bad_record, intent_id '?', source filename:line",
  "wal": "old length-prefixed json, no hmac. torn tail dropped. sqlite may already have the same trans_id.",
  "sort": [
    "occurred_at UTC",
    "source string",
    "source_seq"
  ],
  "duplicates": "duplicate_intent, duplicate_trans_id",
  "entry_id": "first 16 hex of sha256 of compact json {\"i\":intent_id,\"t\":trans_id,\"o\":occurred_at,\"l\":[[account,cents],...]}",
  "audit": "ndjson, one object per decision. keys source, decision (booked|reject), reason, intent_id, trans_id",
  "outputs": [
    "/app/output/ledger.json",
    "/app/output/rejects.json",
    "/app/output/summary.json",
    "/app/output/audit.ndjson"
  ],
  "summary_extra": [
    "sqlite_replayed",
    "feed_frames"
  ]
}
